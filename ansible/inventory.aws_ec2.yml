plugin: amazon.aws.aws_ec2

regions:
  - ap-southeast-1

filters:
  instance-state-name: running
  "tag:Name":
  - web-server
  - ansible-controller
  - monitoring-server

hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_region: "'ap-southeast-1'"
  ansible_aws_ssm_bucket_name: "'bootcamp-2026-azrolali'"
  ansible_aws_ssm_bucket_sse_mode: "'AES256'"

keyed_groups:
  - key: ec2_tags.Name
    prefix: role

groups:
  ansible_ssm: true
