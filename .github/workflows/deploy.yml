name: deploy

on:
  push:
  pull_request:
    branches:
      - final-project
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: launchpad

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launchpad/package-lock.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

  terraform-plan:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::390709476851:role/GitHubActions-TerraformPlan-Role
          aws-region: ap-southeast-1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -no-color

  build-and-push-ecr:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::390709476851:role/GitHubActions-ECR-Role
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/mazrolmali:$IMAGE_TAG ./launchpad
          docker push $REGISTRY/mazrolmali:$IMAGE_TAG

  deploy-web:
    needs: build-and-push-ecr
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::390709476851:role/GitHubActions-ECR-Role
          aws-region: ap-southeast-1

      - name: Deploy image to web server
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ap-southeast-1 \
            --instance-ids i-099cf5b50580cd815 \
            --document-name AWS-RunShellScript \
            --parameters commands="[
              \"aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 390709476851.dkr.ecr.ap-southeast-1.amazonaws.com\",
              \"docker pull 390709476851.dkr.ecr.ap-southeast-1.amazonaws.com/mazrolmali:${IMAGE_TAG}\",
              \"docker rm -f devops-nginx || true\",
              \"docker run -d --name devops-nginx --restart unless-stopped -p 80:80 390709476851.dkr.ecr.ap-southeast-1.amazonaws.com/mazrolmali:${IMAGE_TAG}\",
              \"docker inspect --format='{{.Image}}' devops-nginx\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --region ap-southeast-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-099cf5b50580cd815 \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."
                aws ssm get-command-invocation \
                  --region ap-southeast-1 \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-099cf5b50580cd815 \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment did not complete successfully."
            exit 1
          fi

          echo "Deployment output:"
          aws ssm get-command-invocation \
            --region ap-southeast-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-099cf5b50580cd815 \
            --query 'StandardOutputContent' \
            --output text

  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown renderer
        run: python -m pip install markdown

      - name: Generate documentation site
        run: |
          mkdir -p _site
          python -m markdown README.md -f _site/index.html -x tables -x fenced_code -x toc
          cp -r docs _site/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
